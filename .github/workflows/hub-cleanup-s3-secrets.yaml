# Remove the S3 credential secrets and finished copy Jobs left in namespace hub
# by the hub-backup-s3*.yaml workflows. Deletes nothing else.
name: hub cleanup s3 backup secrets

on:
  push:
    branches:
      - hub-status
    paths:
      - .github/workflows/hub-cleanup-s3-secrets.yaml

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: deploy
    env:
      KUBECONFIG: ${{ github.workspace }}/gfts-track-reconstruction/jupyterhub/secrets/kubeconfig.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Unlock git-crypt secrets
        uses: sliteteam/github-action-git-crypt-unlock@f99c0c6b60bb7ec30dcec033a8f0a3b3d48f21e1
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3.2
        with:
          version: v1.31.0

      - name: Refuse to run while copy pods are active
        run: |
          running=$(kubectl -n hub get pods -l 'app in (s3-backup,s3-copy-slash)' --field-selector=status.phase=Running -o name | wc -l)
          echo "running copy pods: $running"
          [ "$running" -eq 0 ]

      - name: Delete the S3 backup credential secrets, ConfigMap and Jobs
        run: |
          echo "== before"; kubectl -n hub get secrets -o name | grep -E 's3-backup|s3-copy' || echo "(no s3 secrets)"
          for s in $(kubectl -n hub get secrets -o name | grep -E '/(s3-backup|s3-copy)'); do kubectl -n hub delete "$s"; done
          kubectl -n hub delete configmap s3-copy-slash-script --ignore-not-found
          kubectl -n hub delete jobs -l app=s3-copy-slash --ignore-not-found
          kubectl -n hub delete jobs -l app=s3-backup --ignore-not-found
          echo "== after"; kubectl -n hub get secrets -o name | grep -E 's3-backup|s3-copy' || echo "(no s3 secrets left)"
